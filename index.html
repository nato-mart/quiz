<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Question Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column. Segmented mode switch on top, index-card surfaces below.
   Colour: cool slate paper, ink text, cobalt accent, vermilion card rule, highlighter for the answer side. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#F5F7F9; --ink:#17212C; --ink-2:#4B5968; --ink-3:#6E7B88;
  --line:#D5DBE2; --rule:#DCE6F2; --accent:#1B4FD8; --accent-ink:#FFFFFF; --accent-soft:#E3EBFD;
  --mark:#D6452F; --flag:#B45309; --hl:#FFE27A; --good:#17794E; --good-soft:#DDF2E7; --bad:#B8331F; --bad-soft:#FBE3DE;
  --f-display:'Familjen Grotesk','Helvetica Neue',Arial,sans-serif;
  --f-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F141A; --surface:#171E26; --surface-2:#1D252F; --ink:#E8EDF2; --ink-2:#A9B5C1; --ink-3:#8793A0;
    --line:#2B3541; --rule:#26313D; --accent:#7EA2FF; --accent-ink:#0B1220; --accent-soft:#1E2A47;
    --mark:#F0735F; --flag:#F5B042; --hl:#E8C547; --good:#4CC38A; --good-soft:#173528; --bad:#FF8C78; --bad-soft:#3A1E19;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F141A; --surface:#171E26; --surface-2:#1D252F; --ink:#E8EDF2; --ink-2:#A9B5C1; --ink-3:#8793A0;
  --line:#2B3541; --rule:#26313D; --accent:#7EA2FF; --accent-ink:#0B1220; --accent-soft:#1E2A47;
  --mark:#F0735F; --flag:#F5B042; --hl:#E8C547; --good:#4CC38A; --good-soft:#173528; --bad:#FF8C78; --bad-soft:#3A1E19;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
.app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 56px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em;line-height:1.2}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.mono{font-family:var(--f-mono);font-size:.76rem;letter-spacing:.04em;font-variant-numeric:tabular-nums}

/* top bar */

.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:22px}
.tab{border:0;background:transparent;padding:9px 6px;border-radius:7px;cursor:pointer;font-weight:600;font-size:.92rem;color:var(--ink-2);display:flex;gap:7px;justify-content:center;align-items:baseline;min-width:0}
.tab small{font:500 .7rem var(--f-mono);opacity:.75}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

/* buttons and fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:.9rem;line-height:1.2}
.btn:hover:not(:disabled){border-color:var(--ink-3)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.good{background:var(--good);border-color:var(--good);color:var(--accent-ink)}
.btn.learn{background:color-mix(in srgb,var(--hl) 35%,var(--surface));border-color:var(--hl)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 10px;font-size:.8rem}
.btn.danger{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.btn.wide{width:100%;padding:12px 16px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span,.lbl-s{font:500 .68rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
select,input[type="search"],input[type="text"],textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;min-width:0;width:100%}
select{padding-right:8px}
.numin{max-width:9rem;font-variant-numeric:tabular-nums}
.tags{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.src{font:500 .66rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:4px;border:1px solid var(--accent);color:var(--accent);white-space:nowrap}
.src.real{background:var(--hl);border-color:transparent;color:#1B1500;font-weight:600}
.src.sample{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:600}
.seg button:disabled{opacity:.5;cursor:default}
.tag-retry{font:500 .66rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--bad);background:var(--bad-soft);border:1px solid var(--bad);padding:0 6px;border-radius:4px}
textarea{font-family:var(--f-mono);font-size:.8rem;line-height:1.5;resize:vertical;min-height:11rem}
.check{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;color:var(--ink-2);cursor:pointer;padding-bottom:9px}
.check input{accent-color:var(--accent);width:16px;height:16px;margin:0}

/* library */
.lib-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.lib-head h2{font-size:1.5rem}
.sub{color:var(--ink-2);font-size:.9rem;margin-top:2px}
.lib-actions{display:flex;gap:8px;flex-wrap:wrap}
.toolbar{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,14rem) minmax(0,11rem);gap:8px;margin-bottom:12px}
.toolbar.hasflag{grid-template-columns:minmax(0,1fr) minmax(0,12rem) minmax(0,10rem) auto}
#lib-flag:empty{display:none}
.import{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;display:flex;flex-direction:column;gap:12px}
.import h3{font-size:1.05rem}
.import .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.import pre{margin:0;padding:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;overflow-x:auto;font:400 .74rem/1.55 var(--f-mono)}
.msg{font-size:.88rem;color:var(--ink-2)}
.msg.err{color:var(--bad)}
.msg.ok{color:var(--good)}
.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.qact{display:flex;flex-direction:column;gap:6px;flex:none}
.qitem.editing{display:block;border-color:var(--accent)}
.edwrap{background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:16px;margin-bottom:12px}
.editor{display:flex;flex-direction:column;gap:12px;width:100%}
.editor h3{font-size:1.05rem}
.editor textarea{min-height:0;font-family:inherit;font-size:.95rem;line-height:1.45}
.editor .wrongs{display:flex;flex-direction:column;gap:6px}
.editor .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.editor .row{display:flex;gap:8px;flex-wrap:wrap}
.editor .msg:empty{display:none}
.qitem{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.qbody{min-width:0;display:flex;flex-direction:column;gap:6px;flex:1}
.qmeta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;color:var(--ink-2)}
.topic{font-size:.74rem;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:1px 8px;border-radius:99px}
.tag-ex{font:500 .66rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;border:1px dashed var(--ink-3);color:var(--ink-2);padding:0 6px;border-radius:4px}
.st{font:500 .66rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.st.known{color:var(--good)}
.st.again{color:var(--bad)}
.qtext{font-weight:600;overflow-wrap:anywhere}
.atext{color:var(--ink-2);font-size:.92rem;overflow-wrap:anywhere}
.atext .lbl{display:inline-block;margin-right:8px;font:500 .68rem var(--f-mono);color:var(--ink);background:color-mix(in srgb,var(--hl) 55%,transparent);padding:0 5px;border-radius:3px}
.notice{background:var(--surface);border:1px dashed var(--ink-3);border-radius:10px;padding:22px 18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.notice h3{font-size:1.15rem}
.notice p{color:var(--ink-2);max-width:60ch}
.skel{height:78px;border-radius:8px;background:var(--surface);border:1px solid var(--line);opacity:.7}

/* mode options row */
.opts{display:flex;gap:6px 18px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.opts .field{flex:1 1 12rem}
.prog{display:flex;justify-content:space-between;color:var(--ink-2);margin-bottom:6px}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}

/* index card */
.card3d{perspective:1400px;cursor:pointer;border-radius:6px;margin-bottom:14px;-webkit-tap-highlight-color:transparent}
.card{display:grid;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.2,1);min-height:21rem}
.card.flipped{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;
  background-color:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 0 var(--line),0 10px 24px -14px rgba(10,20,40,.35);overflow:hidden;min-width:0}
.face.back{transform:rotateY(180deg);background-color:color-mix(in srgb,var(--hl) 13%,var(--surface))}
.face-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px 10px;border-bottom:2px solid var(--mark);color:var(--ink-2);flex-wrap:wrap}
.face-body{flex:1;padding:12px 18px 8px;display:flex;flex-direction:column;justify-content:center;gap:12px;
  background-image:linear-gradient(var(--rule) 1px,transparent 1px);background-size:100% 2.4rem;background-position:0 1.1rem}
.big{font-family:var(--f-display);font-weight:600;font-size:clamp(1.25rem,4.6vw,1.65rem);line-height:2.4rem;overflow-wrap:anywhere;text-wrap:pretty}
.note{font-size:.95rem;line-height:2.4rem;color:var(--ink-2);overflow-wrap:anywhere}
.face-foot{padding:8px 18px 12px;color:var(--ink-3);font:500 .7rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.fc-nav{display:grid;grid-template-columns:4rem 1fr 4rem;gap:8px;margin-bottom:8px}
.btn.arrow{font-size:1.35rem;line-height:1;padding:10px 0;min-height:48px}
.btn.arrow svg{width:22px;height:22px;display:block}
.qz-nav{display:grid;grid-template-columns:4rem 1fr;gap:8px;margin-top:14px}
.qz-nav .btn.primary{padding:12px 16px}
.nav-hint{margin-top:8px;color:var(--ink-3);font:500 .68rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;text-align:center}
.fc-grade{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kbd{font:500 .66rem var(--f-mono);opacity:.7;border:1px solid currentColor;border-radius:4px;padding:0 5px}
.summary{display:flex;gap:10px;flex-wrap:wrap}
.summary .btn{flex:1 1 12rem}

/* quiz */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.9rem;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.setup{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:16px}
.setup h2{font-size:1.4rem}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;box-shadow:0 10px 24px -16px rgba(10,20,40,.35)}
.qcard .face-top{background:transparent}
.qcard-body{padding:18px;display:flex;flex-direction:column;gap:16px}
.qtitle{font-size:clamp(1.2rem,4.4vw,1.55rem);font-weight:600;overflow-wrap:anywhere;text-wrap:pretty}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;min-width:0}
.choice .key{flex:none;width:26px;height:26px;border-radius:5px;border:1px solid var(--line);display:grid;place-items:center;font:500 .75rem var(--f-mono);color:var(--ink-2);background:var(--surface-2)}
.choice .ctext{min-width:0;overflow-wrap:anywhere;padding-top:2px}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice:disabled{cursor:default;color:inherit}
.choice.is-right{border-color:var(--good);background:var(--good-soft)}
.choice.is-right .key{background:var(--good);border-color:var(--good);color:var(--accent-ink)}
.choice.is-wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice.is-wrong .key{background:var(--bad);border-color:var(--bad);color:var(--accent-ink)}
.choice.is-dim{opacity:.55}
.feedback{border-left:4px solid var(--good);background:var(--good-soft);padding:10px 14px;border-radius:0 8px 8px 0;display:flex;flex-direction:column;gap:2px;font-size:.93rem}
.feedback.no{border-color:var(--bad);background:var(--bad-soft)}
.feedback strong{font-family:var(--f-display);font-size:1.02rem}
.score-big{font-family:var(--f-display);font-weight:700;font-size:clamp(3rem,16vw,4.6rem);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.score-big small{font-size:.4em;color:var(--ink-2);font-weight:500;letter-spacing:0}
.missed{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.missed li{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);display:flex;flex-direction:column;gap:3px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.88rem;max-width:calc(100vw - 32px);z-index:20}
/* question map: one numbered box per question, green when answered correctly and red when not */
.qz-layout{display:grid;gap:16px;align-items:start}
.qz-main{min-width:0}
.qz-map{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;max-height:230px;overflow:auto}
.qz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:6px}
.qz-dot{height:34px;padding:0;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font:500 .8rem var(--f-mono);font-variant-numeric:tabular-nums;cursor:pointer;display:grid;place-items:center}
.qz-dot:hover{border-color:var(--ink-3)}
.qz-dot.ok{background:var(--good);border-color:var(--good);color:var(--accent-ink)}
.qz-dot.no{background:var(--bad);border-color:var(--bad);color:var(--accent-ink)}
.qz-dot[aria-current="step"]{outline:2px solid var(--accent);outline-offset:2px;font-weight:700}
@media (min-width:900px){
  .app.qz-run{max-width:1040px}
  .qz-layout{grid-template-columns:minmax(0,1fr) 232px;gap:20px}
  .qz-map{position:sticky;top:16px;max-height:calc(100vh - 32px)}
}
/* flags: a question you want to come back to */
.flagbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:8px;padding:4px 9px;cursor:pointer;font:600 .78rem var(--f-body);line-height:1.2}
.flagbtn svg{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.flagbtn:hover:not(:disabled){border-color:var(--flag);color:var(--flag)}
.flagbtn[aria-pressed="true"]{border-color:var(--flag);color:var(--flag);background:color-mix(in srgb,var(--flag) 14%,var(--surface))}
.flagbtn[aria-pressed="true"] svg{fill:currentColor}
.flagbtn:disabled{opacity:.5;cursor:default}
.flagbtn.icon{padding:5px 7px}
.flagbtn.big{padding:9px 12px;font-size:.9rem}
.flagchip{display:inline-flex;align-items:center;gap:4px;font:600 .66rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--flag);border:1px solid var(--flag);border-radius:4px;padding:0 6px 0 4px;white-space:nowrap}
.flagchip svg{width:11px;height:11px;fill:currentColor;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.qitem.flagged{box-shadow:inset 3px 0 0 var(--flag)}
.prog{align-items:center}
.prog-r{display:inline-flex;align-items:center;gap:12px}
.qz-dot{position:relative}
.qz-dot.fl::after{content:"";position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--flag);border:2px solid var(--surface)}
.who{margin-top:28px;color:var(--ink-3);font:500 .7rem var(--f-mono);letter-spacing:.04em;text-align:center;overflow-wrap:anywhere}
.who:empty{display:none}
.who b{color:var(--ink-2);font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:520px){
  .toolbar,.toolbar.hasflag{grid-template-columns:1fr}
  .editor .two{grid-template-columns:1fr}
  .fc-nav .btn .kbd,.fc-grade .btn .kbd,.nav-hint{display:none}
  .tab small{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>

<div class="app">
  <nav class="tabs" role="tablist" aria-label="Mode">
    <button class="tab" role="tab" data-act="mode" data-mode="library" id="tab-library">Library <small></small></button>
    <button class="tab" role="tab" data-act="mode" data-mode="flashcards" id="tab-flashcards">Flashcards</button>
    <button class="tab" role="tab" data-act="mode" data-mode="quiz" id="tab-quiz">Quiz</button>
  </nav>
  <main id="view" aria-live="off"></main>
  <p class="who" id="who" role="status"></p>
</div>

const SRC_RE = /\s*\((Prog Test|Prog Check|Real Exam Q|Sample Exam Q)\)\s*$/i;

async function withRetry(fn) {

const store = {
  async add(items) {
    let n = S.qs.reduce((m, q) => Math.max(m, idNum(q.id)), 0) + 1;
    const docs = items.map(it => Object.assign({ id: 'q' + String(n++).padStart(4, '0') }, it));
    if (db) {
      const errs = await runPool(docs, d => db.collection('questions').doc(d.id).set(strip(d)), 4);
      if (errs.length) throw new Error(errs.length + ' of ' + docs.length + ' could not be saved (' + (errs[0].message || errs[0].code || 'error') + ').');
    } else {
      S.qs = S.qs.concat(docs); lsSet('qb:questions', S.qs); refresh();
    }
    return docs.length;
  },
  async update(id, doc) {
    const full = Object.assign({ id: id }, doc);
    if (db) {
      await withRetry(() => db.collection('questions').doc(id).set(strip(full)));
      S.qs = S.qs.map(q => q.id === id ? full : q); refresh();
    } else {
      S.qs = S.qs.map(q => q.id === id ? full : q); lsSet('qb:questions', S.qs); refresh();
    }
  },
  async remove(ids) {
    if (db) {
      const errs = await runPool(ids, id => db.doc('questions/' + id).delete(), 4);
      if (errs.length) throw new Error('Some questions could not be deleted.');
    } else {
      const set = new Set(ids); S.qs = S.qs.filter(q => !set.has(q.id)); lsSet('qb:questions', S.qs); refresh();
    }
  }
};

async function edSave() {
  const e = S.edit; if (!e || e.busy) return;

  let q = d.q.trim(); const a = d.a.trim();
  if (!q) return fail('Write the question.', 'q');
  if (!a) return fail('Write the correct answer.', 'a');
  const sp = splitTag(q); q = sp.q; let source = canonSource(d.source) || sp.source;
  const wrong = d.wr.map(x => x.trim()).filter((x, i, arr) => x && arr.indexOf(x) === i);
  if (wrong.some(x => x.toLowerCase() === a.toLowerCase())) return fail('One of the wrong answers is the same as the correct answer.', 'a');
  const k = q.toLowerCase(), orig = isNew ? null : S.map.get(e.id);
  if (!isNew && !orig) { S.edit = null; updateLibrary(); toast('That question no longer exists'); return; }
  if (!(orig && orig.q.trim().toLowerCase() === k)) {
    const clash = S.qs.find(x => x.id !== e.id && x.q.trim().toLowerCase() === k);
    if (clash) return fail('That question is already in the bank (' + qlabel(clash) + ').', 'q');
  }
  const out = Object.assign({}, orig || {}); delete out.id;
  out.q = q; out.a = a; out.wrong = wrong; out.topic = d.topic.trim();
  const note = d.note.trim(); if (note) out.note = note; else delete out.note;
  if (source) out.source = source; else delete out.source;
  e.busy = true; e.msg = ''; updateLibrary();
  try {
    if (isNew) {
      const label = qlabel({ id: 'q' + (S.qs.reduce((m, x) => Math.max(m, idNum(x.id)), 0) + 1) });
      await store.add([out]);

      const li = $('[data-qid="' + id + '"]'); if (li) li.scrollIntoView({ block: 'nearest' });
    }
  } catch (err) { fail('Could not save: ' + (err && (err.message || err.code) || 'unknown error')); }
}

async function doImport() {
  const ta = $('#importText'), msg = $('#importMsg'), btn = $('#btn-do-import');
  const say = (t, c) => { msg.textContent = t; msg.className = 'msg ' + (c || ''); };
  let data;
  try { data = JSON.parse(ta.value); } catch (e) { say('That is not valid JSON. Check for a missing comma or quote.', 'err'); return; }
  if (data && !Array.isArray(data)) data = data.questions;
  if (!Array.isArray(data)) { say('Expected a list of questions, or an object with a "questions" list.', 'err'); return; }
  const seen = new Set(S.qs.map(q => q.q.trim().toLowerCase()));
  const items = []; let bad = 0, dup = 0;
  data.forEach(r => {
    const n = normalize(r);
    if (!n) { bad++; return; }
    const k = n.q.toLowerCase();
    if (seen.has(k)) { dup++; return; }
    seen.add(k); items.push(n);
  });
  if (!items.length) { say(dup ? 'Every question in that list is already in the bank.' : 'No usable questions found. Each needs a "q" and an "a".', 'err'); return; }
  btn.disabled = true; say('Saving ' + items.length + ' questions');
  try {
    const n = await store.add(items);
    ta.value = '';
    say(`Added ${n} question${n === 1 ? '' : 's'}${dup ? `, skipped ${dup} already in the bank` : ''}${bad ? `, skipped ${bad} without a question or answer` : ''}.`, 'ok');
  } catch (e) { say('Could not save: ' + (e.message || e.code || 'unknown error'), 'err'); }
  btn.disabled = false;
}

  else if (id === 'qz-source') { S.qzOpts.source = e.target.value; renderQuizSetup(); }
  else if (id === 'qz-custom') { qzSyncSetup(false); }
  else if (id === 'qz-repeat') { S.qzOpts.repeat = e.target.checked; }
  else if (id === 'importFile') {
    const file = e.target.files && e.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = () => { $('#importText').value = String(r.result || ''); $('#importMsg').textContent = 'Loaded ' + file.name + '. Press Add to bank.'; };
    r.readAsText(file); e.target.value = '';
  }
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest && e.target.closest('input,textarea,select')) return;
  const onButton = e.target.closest && e.target.closest('button');
  if (S.mode === 'flashcards' && S.fc && S.fc.done) {
    if (e.key === 'ArrowLeft') { e.preventDefault(); actions['fc-back'](); }
  } else if (S.mode === 'flashcards' && S.fc && !S.fc.done && S.fc.deck.length) {
    if ((e.key === ' ' || e.key === 'Enter') && !onButton) { e.preventDefault(); fcFlip(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); fcGo(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); actions['fc-prev'](); }
    else if (e.key.toLowerCase() === 'f') toggleFlag(S.fc.deck[S.fc.i]);
    else if (e.key === '1') fcMark('again');
    else if (e.key === '2') fcMark('known');
  } else if (S.mode === 'quiz' && S.qz && S.qz.phase === 'run') {
    const it = S.qz.items[S.qz.i];
    const k = e.key.toLowerCase();
    if (e.key === 'ArrowRight') { e.preventDefault(); qzGo(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); qzGo(-1); }
    else if (k === 'f') toggleFlag(it.id);
    else if (it.picked == null) {
      const idx = /^[1-6]$/.test(k) ? parseInt(k, 10) - 1 : 'abcdef'.indexOf(k);
      if (k.length === 1 && idx >= 0) qzPick(idx);
    }
  }
});

/* ---------- boot ---------- */
async function init() {
  const h = (location.hash || '').slice(1);
  if (MODES.includes(h)) S.mode = h;
  render();
  const claude = window.claude;
  let user = null;
  try { if (claude && claude.use) db = await claude.use('db'); } catch (e) { db = null; }
  try { if (claude && claude.use) user = await claude.use('user'); } catch (e) { user = null; }
  if (user) { try { if ((await user.can('data.write')) === false) S.canWrite = false; } catch (e) {} }
  let me = null;
  if (user && db) { try { me = await user.me(); } catch (e) { me = null; } }
  if (me && me.id) {
    adoptLocal(me.id); study.name = me.name || '';
    try { study.col = db.collection('data/users/' + me.id); startStudySync(); } catch (e) { study.ok = false; }
  }
  renderWho();
  const useLocal = () => { db = null; S.source = 'local'; S.qs = loadLocalQuestions(); S.loaded = true; refresh(); };
  if (!db) { useLocal(); return; }
  S.source = 'shared';
  db.collection('questions').onSnapshot(snap => {
    S.qs = snap.docs.map(d => fixSource(Object.assign({ id: d.id }, d.data()))).sort((a, b) => idNum(a.id) - idNum(b.id) || a.id.localeCompare(b.id));
    S.loaded = true; refresh();
  }, err => {
    useLocal(); toast('Could not load the saved questions. Showing this browser\'s copy.');
  });
}
init();
})();
</script>
</body></html>
